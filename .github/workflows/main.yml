name: Validate and Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check JS syntax
        run: |
          for f in $(find . -name "*.js" -not -path "*/.git/*"); do
            echo "Checking $f"
            node --check "$f" || exit 1
          done

      - name: Check JSON syntax
        run: |
          for f in $(find . -name "*.json" -not -path "*/.git/*"); do
            echo "Checking $f"
            python3 -m json.tool "$f" > /dev/null || exit 1
          done

      - name: Install tidy
        run: sudo apt-get install -y tidy

      - name: Check HTML syntax
        run: |
          for f in $(find . -name "*.html" -not -path "*/.git/*"); do
            echo "Checking $f"
            tidy -q -e "$f"
            if [ $? -eq 2 ]; then exit 1; fi
          done

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Copy files via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          source: "*"
          target: voimapuu.fi
          timeout: "120s"
